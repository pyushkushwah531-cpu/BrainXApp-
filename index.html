  --tw-ring-color: rgb(79 70 229 / var(--tw-ring-opacity, 1));
}

.ring-\[\#E2E8F0\]{
  --tw-ring-opacity: 1;
  --tw-ring-color: rgb(226 232 240 / var(--tw-ring-opacity, 1));
}

.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.backdrop-blur{
  --tw-backdrop-blur: blur(8px);
  backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);
}

.transition{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-all{
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --bg:#EEF2FF;
  --surface:#FFFFFF;
  --surface-2:#F8FAFF;
  --navy:#0F172A;
  --navy-2:#1E293B;
  --indigo:#4F46E5;
  --violet:#7C3AED;
  --violet-soft:#EDE9FE;
  --indigo-soft:#EEF2FF;
  --text:#0F172A;
  --muted:#64748B;
  --line:#E2E8F0;
  --success:#10B981;
  --amber:#F59E0B;
  --rose:#F43F5E;
  --sky:#0EA5E9;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B1220;
    --surface:#111B31;
    --surface-2:#16203A;
    --text:#F1F5F9;
    --muted:#94A3B8;
    --line:#1E293B;
  }
}

*{
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:'Nunito',ui-sans-system,system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.font-display{
  font-family:'Outfit','Nunito',ui-sans-system,sans-serif;
}

.no-scrollbar::-webkit-scrollbar{
  display:none;
}

.no-scrollbar{
  scrollbar-width:none;
}

@keyframes pop{
  0%{
    transform:scale(.92);
    opacity:0
  }

  100%{
    transform:scale(1);
    opacity:1
  }
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-6px)
  }
}

@keyframes pulse-ring{
  0%{
    box-shadow:0 0 0 0 rgba(79,70,229,.35)
  }

  100%{
    box-shadow:0 0 0 14px rgba(79,70,229,0)
  }
}

.animate-pop{
  animation:pop .22s ease both;
}

.animate-floaty{
  animation:floaty 3s ease-in-out infinite;
}

.animate-ring{
  animation:pulse-ring 1.2s ease-out infinite;
}

@keyframes fade-in{
  0%{
    opacity:0;
    transform:translate(-50%,8px)
  }

  100%{
    opacity:1;
    transform:translate(-50%,0)
  }
}

.animate-fade-in{
  animation:fade-in .45s ease both;
}
